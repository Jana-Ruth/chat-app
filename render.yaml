services:
  - type: web
    name: pulse-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret for you
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false # set after the frontend deploys, e.g. https://pulse-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false # same value as CLIENT_ORIGIN
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Pulse <onboarding@resend.dev>"

  - type: web
    name: pulse-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set after the backend deploys, e.g. https://pulse-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        sync: false # same host as above, without /api, e.g. https://pulse-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
